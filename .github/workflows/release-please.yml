name: release-please

# Releases happen on demand, never on a plain push:
# - run this workflow by hand (gh workflow run release-please.yml) to open the release PR;
# - merging that PR ("chore: release skills") runs it again to tag and publish.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: "github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore: release')"
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
