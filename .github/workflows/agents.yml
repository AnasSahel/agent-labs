name: agents

# Each skill carries copies of the agents and frameworks it lists; agents/ and frameworks/ are the source.
# Also fails when a framework mapping cites an ISO 27001 ref that does not exist.
# Fails when a copy is missing, stale or no longer listed.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  copies-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/sync-agents --check
      - run: scripts/check-frameworks
