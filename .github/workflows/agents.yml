name: agents

# Each skill carries copies of the agents it lists; agents/ is the source.
# Fails when a copy is missing, stale or no longer listed.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  copies-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/sync-agents --check
