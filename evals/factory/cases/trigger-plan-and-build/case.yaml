schema_version: '1.1'
name: trigger-plan-and-build
description: '''Plan issue 001 and build it'' goes to factory-build, never to factory-plan: the word plan belongs to one skill.'
tags:
- triggers
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 12
  timeout_seconds: 420
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: 'Plan issue 001 and build it once I''ve accepted the plan.

    '
graders:
  - {"name": "calls-factory-build", "type": "tool_used", "tool": "Skill", "input_match": "\"skill\"\\s*:\\s*\"(factory:)?factory-build\"", "arm": "both"}
  - {"name": "no-factory-plan", "type": "tool_used", "tool": "Skill", "input_match": "\"skill\"\\s*:\\s*\"(factory:)?factory-plan\"", "arm": "both", "min": 0, "max": 0}
