schema_version: '1.1'
name: trigger-run-request
description: A new request the user wants built end to end goes to factory-run, the driver.
tags:
- triggers
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 12
  timeout_seconds: 420
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: '`notes list` should print the number of notes on a last line. Build it and get it to a pull request, I don''t want to start each step myself.

    '
graders:
  - {"name": "calls-factory-run", "type": "tool_used", "tool": "Skill", "input_match": "\"skill\"\\s*:\\s*\"(factory:)?factory-run\"", "arm": "both"}
