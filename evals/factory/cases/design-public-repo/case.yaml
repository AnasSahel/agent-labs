schema_version: '1.1'
name: design-public-repo
description: On a public repo no finding reaches the spec, but the questions stay, reworded as plain decisions.
tags:
- factory-design
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 100
  timeout_seconds: 900
  allowed_tools:
  - Bash
  - Write
  - Edit
  - Read
  - Glob
  - Grep
  - Skill
  - Agent
  prompt: '/factory:factory-design 002 I''m away: run it unattended and ask me nothing.

    '
graders:
  - {"name": "spec-002-written", "type": "tool_used", "tool": "Write", "input_match": "specs/002-[a-z0-9-]+\\.md"}
  - {"name": "no-findings-section", "type": "tool_used", "tool": "Write", "input_match": "specs/002-[a-z0-9-]+\\.md[\\s\\S]*## Findings", "min": 0, "max": 0}
  - {"name": "questions-stay", "type": "tool_used", "tool": "Write", "input_match": "specs/002-[a-z0-9-]+\\.md[\\s\\S]*## Questions"}
  - {"name": "review-notes-private", "type": "llm", "weight": 2, "focus": "last_message", "criteria": "The repo is public and the run is unattended. The feature sends notes to email addresses and records who received them, so the review raises personal-data questions (for example how long that record is kept). PASS only if the reply says the review notes or findings are kept out of the repo (kept privately, or given in this reply and not saved), and says the spec waits at needs-design for answers or for approval. FAIL if it says findings were committed to the repo."}
