schema_version: '1.1'
name: build-split-part-waits
description: A part that comes after another waits until that one is built.
tags:
- factory-build
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 420
  allowed_tools:
  - Bash
  - Write
  - Edit
  - Read
  - Glob
  - Grep
  - Skill
  - Agent
  prompt: '/factory:factory-build 004 I''m away: run it unattended and ask me nothing.

    '
graders:
  - {"name": "no-plan-written", "type": "tool_used", "tool": "Write", "input_match": "plan\\.md", "min": 0, "max": 0}
  - {"name": "waits-for-003", "type": "llm", "weight": 2, "focus": "last_message", "criteria": "Issue 004 is part 2 of a split and comes after part 003, which is not built yet. PASS only if the reply says 004 waits for 003 to be built and stops, with no plan written. FAIL if it plans or builds 004."}
