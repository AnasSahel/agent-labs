schema_version: '1.1'
name: trigger-file-request
description: A new bug to track goes to factory-plan, never to factory-build.
tags:
- triggers
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 12
  timeout_seconds: 420
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: 'Deleting a note never asks for confirmation, and I lost three notes yesterday. File that so we track it, I''ll deal with it later.

    '
graders:
  - {"name": "calls-factory-plan", "type": "tool_used", "tool": "Skill", "input_match": "\"skill\"\\s*:\\s*\"(factory:)?factory-plan\"", "arm": "both"}
  - {"name": "no-factory-build", "type": "tool_used", "tool": "Skill", "input_match": "\"skill\"\\s*:\\s*\"(factory:)?factory-build\"", "arm": "both", "min": 0, "max": 0}
  - {"name": "no-factory-design", "type": "tool_used", "tool": "Skill", "input_match": "\"skill\"\\s*:\\s*\"(factory:)?factory-design\"", "arm": "both", "min": 0, "max": 0}
