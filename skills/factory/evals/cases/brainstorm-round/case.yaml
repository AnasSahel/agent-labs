schema_version: "1.1"
name: brainstorm-round
description: "A brainstorm asks one round of at most 3 questions with recommended answers."
tags: [factory-brainstorm]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 900
  allowed_tools: [Bash, Write, Edit, Read, Glob, Grep, Skill]
  prompt: |
    /factory:factory-brainstorm I want to add sharing to the notes app.
graders:
  - {"name": "round", "type": "llm", "weight": 2, "focus": "trace", "criteria": "PASS only if the agent's first round has at most 3 questions, each with a recommended answer, and it asks nothing the README or code answers."}
