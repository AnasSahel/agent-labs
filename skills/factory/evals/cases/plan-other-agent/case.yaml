schema_version: "1.1"
name: plan-other-agent
description: "A request from another agent is not grilled: facts looked up, user decisions left as [to fill]."
tags: [factory-plan]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Bash, Write, Edit, Read, Glob, Grep, Skill]
  prompt: |
    /factory:factory-plan Request from agent:support-bot (not a person): customers report the notes page title is misspelled.
graders:
  - {"name": "no-questions", "type": "llm", "weight": 2, "focus": "trace", "criteria": "PASS only if the agent asks the user no question before publishing, and the intent it writes marks decisions the request did not state (why now, success, constraints) as [to fill]. Looking up the code (src/page.html) is expected."}
