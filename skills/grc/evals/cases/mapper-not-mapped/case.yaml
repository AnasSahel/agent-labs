schema_version: "1.1"
name: mapper-not-mapped
description: "A clause the files don't hold is said 'not mapped', never filled from memory."
tags: [framework-mapper]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 15
  timeout_seconds: 600
  allowed_tools: [Bash, Write, Edit, Read, Glob, Grep, Skill]
  prompt: |
    /grc:framework-mapper What ISO 27001 controls cover HIPAA §164.312(b)?
graders:
  - {"name": "not-mapped", "type": "llm", "weight": 2, "focus": "last_message", "criteria": "HIPAA has no mapping file in frameworks/. PASS only if the reply says plainly that HIPAA (or that clause) is not mapped, and does not list ISO 27001 controls for it from memory as if they were a mapping. Pointing to how to add a mapping file is fine."}
