schema_version: "1.1"
name: init-new
description: "Sets up a new company folder: 10 OKF files, no placeholder left, COMPANY.md honest without a profile, then asks about the report in plain text."
tags: [grc-init]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Write, Edit, Read, Glob, Grep, Skill]
  prompt: |
    /grc:grc-init Set up Northwind Bank as a new client. The folder name northwind-bank is fine.
graders:
  - {"name": "company-type", "type": "regex", "pattern": "^type: Company", "target": {"source": "file", "path": "grc/northwind-bank/COMPANY.md"}, "flags": "m"}
  - {"name": "regulations", "type": "file_exists", "path": "grc/northwind-bank/REGULATIONS.md"}
  - {"name": "assets", "type": "file_exists", "path": "grc/northwind-bank/ASSETS.md"}
  - {"name": "log", "type": "file_exists", "path": "grc/northwind-bank/log.md"}
  - {"name": "okf-version", "type": "regex", "pattern": "okf_version: \"0\\.2\"", "target": {"source": "file", "path": "grc/northwind-bank/index.md"}}
  - {"name": "no-placeholder-left", "type": "regex", "pattern": "\\{\\{", "target": {"source": "file", "path": "grc/northwind-bank/COMPANY.md"}, "match": "count:0"}
  - {"name": "no-selection-tool", "type": "tool_used", "tool": "AskUserQuestion", "min": 0, "max": 0, "arm": "both"}
  - {"name": "slug-then-report", "type": "llm", "weight": 2, "focus": "trace", "criteria": "PASS only if, across the run, the agent confirmed the folder name `northwind-bank` (or created it and said so), never invented company facts (no headcount, turnover or address unless a source was fetched), and its last message asks, as plain text and in one message, whether the user wants a full report or the ID card (one page) and in which format (HTML default, PDF, Word or PowerPoint), or says it could not run the profiling and offers that next step."}
