schema_version: "1.1"
name: report-full
description: "Writes the full report with every section and every open question, no invented fact."
tags: [company-report]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Write, Edit, Read, Glob, Grep, Skill]
  prompt: |
    /grc:company-report Write the full report for Northwind Bank, HTML.
graders:
  - {"name": "report", "type": "file_exists", "path": "grc/northwind-bank/report.html"}
  - {"name": "group-section", "type": "regex", "pattern": "Northwind IT Services", "target": {"source": "file", "path": "grc/northwind-bank/report.html"}}
  - {"name": "no-example-leftover", "type": "regex", "pattern": "Acme", "target": {"source": "file", "path": "grc/northwind-bank/report.html"}, "match": "count:0"}
  - {"name": "all-sections", "type": "llm", "weight": 2, "focus": "trace", "criteria": "PASS only if report.html has the four sections (group structure, company facts with sources, regulations with authorities, open questions), the completeness bars for 8 files, every open question of COMPANY.md and REGULATIONS.md, and only facts that are in the folder (no invented CISO, DPO, certification or balance sheet)."}
