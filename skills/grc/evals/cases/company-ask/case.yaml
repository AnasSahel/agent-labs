schema_version: "1.1"
name: company-ask
description: "With two company folders and no company named, the skill asks which one, in plain text, before reading or writing anything."
tags: [risk-register]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 10
  timeout_seconds: 600
  allowed_tools: [Bash, Write, Edit, Read, Glob, Grep, Skill]
  prompt: |
    /grc:risk-register Show me the risk register.
graders:
  - {"name": "asks-which", "type": "llm", "weight": 2, "focus": "trace", "criteria": "PASS if the reply asks which company to work on and names both northwind-bank and contoso-bank (or Northwind Bank and Contoso Bank), as a plain question. FAIL if it picks one without asking, or reads or writes a register for either company first."}
