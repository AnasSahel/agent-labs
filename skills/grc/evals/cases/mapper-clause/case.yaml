schema_version: "1.1"
name: mapper-clause
description: "Looks up DORA Art. 19 with crosswalk.py and gives the rows as they come, partial fits with their extras."
tags: [framework-mapper]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 15
  timeout_seconds: 600
  allowed_tools: [Bash, Write, Edit, Read, Glob, Grep, Skill]
  prompt: |
    /grc:framework-mapper Which ISO 27001 controls meet DORA Art. 19, and what else does DORA ask there that ISO doesn't?
graders:
  - {"name": "runs-crosswalk", "type": "tool_used", "tool": "Bash", "input_match": "crosswalk\\.py"}
  - {"name": "no-grc-grill", "type": "tool_used", "tool": "Skill", "input_match": "\"skill\"\\s*:\\s*\"(grc:)?grc-grill\"", "min": 0, "max": 0, "arm": "both"}
  - {"name": "answer-from-files", "type": "llm", "weight": 2, "focus": "last_message", "criteria": "PASS only if the reply opens with a one-line answer, lists the ISO 27001 refs DORA Art. 19 maps to in a table, shows any partial fit together with its extras (the DORA-only duties such as reporting deadlines), and does not ask the user any question."}
