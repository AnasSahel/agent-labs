schema_version: "1.1"
name: evidence-unproven
description: "Catches controls the register calls in place with no evidence behind them."
tags: [audit-evidence]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Write, Edit, Read, Glob, Grep, Skill]
  prompt: |
    /grc:audit-evidence Which of our controls can we actually prove for the ISO 27001 audit?
graders:
  - {"name": "no-grc-grill", "type": "tool_used", "tool": "Skill", "input_match": "\"skill\"\\s*:\\s*\"(grc:)?grc-grill\"", "min": 0, "max": 0, "arm": "both"}
  - {"name": "unproven", "type": "llm", "weight": 2, "focus": "trace", "criteria": "There is no grc/evidence/ folder in the sample. R-001 is 'treated' with control A.8.20, so the register implies it is in place. PASS only if the reply says no evidence is filed yet (nothing is proven), flags controls the register relies on with no proof (A.8.20 at least, or the controls of treated risks), and proposes requests to control owners or a next step. It must not claim any control is evidenced."}
