schema_version: "1.1"
name: router-raci
description: "Routes 'who signs off on what' to raci-builder."
tags: [grc-router]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Write, Edit, Read, Glob, Grep, Skill]
  prompt: |
    /grc:grc-router Who should be accountable for incident response here, and who just gets informed?
graders:
  - {"name": "calls-raci-builder", "type": "tool_used", "tool": "Skill", "input_match": "\"skill\"\\s*:\\s*\"(grc:)?raci-builder\"", "arm": "both"}
  - {"name": "no-policy-writer", "type": "tool_used", "tool": "Skill", "input_match": "\"skill\"\\s*:\\s*\"(grc:)?policy-writer\"", "min": 0, "max": 0, "arm": "both"}
