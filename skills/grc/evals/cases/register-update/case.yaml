schema_version: "1.1"
name: register-update
description: "Updates only the owner of R-003, sets Updated, and logs the change with the user's words."
tags: [risk-register]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Write, Edit, Read, Glob, Grep, Skill]
  prompt: |
    /grc:risk-register Make Julie P. the owner of R-003 — she takes over from the HR Director as of today.
graders:
  - {"name": "owner-changed", "type": "regex", "pattern": "\\| R-003 \\|[^\\n]*\\| Julie P\\. \\|", "target": {"source": "file", "path": "grc/risk-register.md"}}
  - {"name": "updated-today", "type": "regex", "pattern": "\\| R-003 \\|[^\\n]*\\| 2026-10-31 \\|", "target": {"source": "file", "path": "grc/risk-register.md"}}
  - {"name": "scores-untouched", "type": "regex", "pattern": "\\| R-003 \\|[^\\n]*G3·V3 high[^\\n]*G3·V1 medium", "target": {"source": "file", "path": "grc/risk-register.md"}}
  - {"name": "change-logged", "type": "regex", "pattern": "Julie P\\.", "target": {"source": "file", "path": "grc/traces/2026-10-31-register.md"}}
