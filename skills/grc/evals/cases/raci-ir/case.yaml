schema_version: "1.1"
name: raci-ir
description: "Drafts IR activities from duties.md and grills hard on accountability with a cited question."
tags: [raci-builder]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Write, Edit, Read, Glob, Grep, Skill]
  prompt: |
    /grc:raci-builder Build a RACI for incident response.
graders:
  - {"name": "calls-grc-grill", "type": "tool_used", "tool": "Skill", "input_match": "\"skill\"\\s*:\\s*\"(grc:)?grc-grill\"", "arm": "both"}
  - {"name": "first-question", "type": "llm", "weight": 2, "focus": "last_message", "criteria": "The agent starts an incident response RACI. It asks exactly one interview question, numbered `Q1/10` (the question budget is 10), followed by a `Recommended:` answer whose reason cites a specific clause (for example `ISO 27001 A.5.24`, `NIS2 Art. 21(2)(b)`, `DORA Art. 17`, `GDPR Art. 33`), not only a framework name. It does not ask for the sector, the frameworks in scope or the risk appetite: grc/context.md already states them (payments fintech in France; ISO 27001, NIS2, DORA, GDPR; residual at most medium unless the CISO Sarah M. accepts in writing). The first question is a decision the user is accountable for (scope of the matrix, or who is accountable or responsible for an activity), not a minor detail."}
