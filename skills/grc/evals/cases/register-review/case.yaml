schema_version: "1.1"
name: register-review
description: "Review flags R-001 overdue and stale, R-002..R-004 above appetite, with a heat map, no grilling."
tags: [risk-register]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Bash, Write, Edit, Read, Glob, Grep, Skill]
  prompt: |
    /grc:risk-register Review our risk register.
graders:
  - {"name": "no-grc-grill", "type": "tool_used", "tool": "Skill", "input_match": "\"skill\"\\s*:\\s*\"(grc:)?grc-grill\"", "min": 0, "max": 0, "arm": "both"}
  - {"name": "flags", "type": "llm", "weight": 2, "focus": "trace", "criteria": "Today is 2026-10-31. R-001 is due 2026-06-30, status treated (not closed), updated 2026-01-10. R-002, R-003, R-004 are high today (G4·V3, G3·V3, G4·V3) with residual medium once fixes land, none accepted; appetite is medium. PASS only if the reply: flags R-001 as overdue and stale (over 90 days), flags R-002, R-003 and R-004 as above appetite (and asks for or suggests interim acceptance by the CISO), shows a portfolio heat map (4x4 grid of severity by likelihood, as a table or a drawing) with the risk ids in cells, and writes dates with the year."}
