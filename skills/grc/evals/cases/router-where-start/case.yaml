schema_version: "1.1"
name: router-where-start
description: "With no task, answers where the user stands from grc/ in a few lines and offers one next step, calling nothing."
tags: [grc-router]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Write, Edit, Read, Glob, Grep, Skill]
  prompt: |
    /grc:grc-router Where do we stand and what should I do next?
graders:
  - {"name": "no-risk-register", "type": "tool_used", "tool": "Skill", "input_match": "\"skill\"\\s*:\\s*\"(grc:)?risk-register\"", "min": 0, "max": 0, "arm": "both"}
  - {"name": "no-gap-analysis", "type": "tool_used", "tool": "Skill", "input_match": "\"skill\"\\s*:\\s*\"(grc:)?gap-analysis\"", "min": 0, "max": 0, "arm": "both"}
  - {"name": "no-risk-assessment", "type": "tool_used", "tool": "Skill", "input_match": "\"skill\"\\s*:\\s*\"(grc:)?risk-assessment\"", "min": 0, "max": 0, "arm": "both"}
  - {"name": "no-committee-report", "type": "tool_used", "tool": "Skill", "input_match": "\"skill\"\\s*:\\s*\"(grc:)?committee-report\"", "min": 0, "max": 0, "arm": "both"}
  - {"name": "stands-and-next", "type": "llm", "weight": 2, "focus": "last_message", "criteria": "The org (Acme Pay) has a risk register with R-001 to R-004; R-002, R-003, R-004 are high with fixes not yet in place, so above the 'medium' appetite; R-001 was last updated 2026-01-10 and is past its due date 2026-06-30. PASS only if the reply: answers where they stand in a few lines grounded in these files (mentions risks above appetite or the register flags), offers exactly one next step that is the risk-register review or committee-report, and waits for the user instead of starting the work. It must not suggest starting with gap-analysis as if nothing existed."}
