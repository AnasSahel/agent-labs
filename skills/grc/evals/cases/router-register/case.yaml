schema_version: "1.1"
name: router-register
description: "Routes a view/filter request on the list of risks to risk-register."
tags: [grc-router]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Write, Edit, Read, Glob, Grep, Skill]
  prompt: |
    /grc:grc-router Which of our risks are overdue or above appetite?
graders:
  - {"name": "calls-risk-register", "type": "tool_used", "tool": "Skill", "input_match": "\"skill\"\\s*:\\s*\"(grc:)?risk-register\"", "arm": "both"}
  - {"name": "no-risk-assessment", "type": "tool_used", "tool": "Skill", "input_match": "\"skill\"\\s*:\\s*\"(grc:)?risk-assessment\"", "min": 0, "max": 0, "arm": "both"}
