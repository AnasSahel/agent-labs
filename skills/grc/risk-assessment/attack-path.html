<!doctype html>
<!-- Attack path template. Fill only the JSON in <script id="data">; the page draws itself. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attack path</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
  /* Theme: see theme.md. One blue accent, grays, risk colors only as signals. Flat, square, light only. */
  :root { --bg:#F1F2F3; --card:#FAFAFA; --ink:#111418; --ink-2:#3D434C; --muted:#6F757E; --line:#D9DBDE;
          --accent:#2F5BFF; --accent-soft:#E6ECFF;
          --red:#C4314B; --red-soft:#F8E6E9; --amber:#A86400; --amber-soft:#F7EEDF; --green:#2E7D4F; --green-soft:#E4F1E9;
          --sans:Geist, system-ui, -apple-system, sans-serif; --mono:"Geist Mono", ui-monospace, Menlo, monospace; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 var(--sans); }
  main { max-width:76rem; margin:0 auto; padding:0 1.25rem; }
  @media (min-width:40rem) { main { padding:0 2rem; } }
  header { padding:28px 0 18px; }
  .eyebrow { font:400 11px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin-bottom:10px; }
  h1 { margin:0 0 10px; font-size:clamp(24px,3vw,32px); line-height:1.15; font-weight:600; letter-spacing:-.03em; max-width:30em; }
  h1 .accent { color:var(--accent); margin-left:.3em; }
  .scenario { margin:0; color:var(--ink-2); max-width:48rem; font-size:14px; line-height:1.55; }
  .section { margin-top:8px; border-top:1px solid var(--ink); }
  .section h2 { margin:0; padding:12px 0; border-bottom:1px solid var(--line); font-size:12px; font-weight:600; }
  #canvas { position:relative; margin:8px 0 16px; }
  svg.wires { position:absolute; inset:0; overflow:visible; pointer-events:none; }
  .node { position:absolute; width:150px; transform:translateX(-50%); text-align:center; }
  .tile { width:56px; height:56px; margin:0 auto 8px; border-radius:4px; display:grid; place-items:center; background:var(--card);
          border:1px solid var(--line); position:relative; }
  .tile svg { width:26px; height:26px; stroke:var(--ink-2); }
  .source .tile { background:var(--ink); border-color:var(--ink); transform:rotate(45deg); }
  .source .tile svg { stroke:#fff; transform:rotate(-45deg); }
  .asset .tile { background:var(--accent); border-color:var(--accent); }
  .asset .tile svg { stroke:#fff; }
  .impact .tile { background:var(--red-soft); border-color:var(--red); }
  .impact .tile svg { stroke:var(--red); }
  .badge { position:absolute; top:-8px; right:-8px; min-width:18px; height:18px; border-radius:2px; background:var(--red); color:#fff;
           font:500 11px/18px var(--mono); padding:0 4px; }
  .source .badge { transform:rotate(-45deg); }
  .start { position:absolute; width:40px; height:40px; margin:-20px 0 0 -20px; border-radius:50%; background:var(--card);
           border:1px solid var(--ink); display:grid; place-items:center; }
  .start svg { width:20px; height:20px; fill:var(--ink); margin-left:2px; }
  .label, .type { display:table; margin:0 auto; padding:0 4px; background:var(--bg); }
  .label { font-weight:600; font-size:14px; letter-spacing:-.01em; }
  .type { color:var(--muted); font:400 10px var(--mono); letter-spacing:.08em; text-transform:uppercase; margin-top:2px; }
  .finding { margin:5px auto 0; width:150px; border:1px dashed var(--red); border-radius:2px; background:var(--card); padding:4px 7px; text-align:left; }
  .finding small { display:block; color:var(--red); font:500 9px/1.2 var(--mono); letter-spacing:.08em; text-transform:uppercase; margin-bottom:1px; }
  .finding b { font-size:12px; font-weight:500; display:block; }
  .finding span { color:var(--muted); font:400 10px var(--mono); }
  .edge { position:absolute; transform:translate(-50%,-100%); text-align:center; width:max-content; pointer-events:none; }
  .edge.side .control { margin:10px 0 0; }
  .edge.side[style*="text-align:right"] .control { margin-left:auto; }
  .edge[style*=right] .control { margin-left:auto; } .edge[style*=right] .sev { float:right; }
  .edge .rel { font-size:12px; color:var(--ink-2); background:var(--bg); padding:0 4px; }
  .sev { display:inline-flex; align-items:center; gap:4px; font:500 10px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--red); background:var(--bg); padding:0 4px; }
  .sev.medium { color:var(--amber); } .sev.low { color:var(--green); }
  .sev::before { content:""; width:6px; height:6px; background:currentColor; }
  .control { display:flex; margin:6px auto; max-width:100%; text-align:left; align-items:center; gap:5px; width:max-content;
             background:var(--green-soft); color:var(--green); border:1px solid var(--green); border-radius:2px; padding:3px 7px; font:500 11px var(--sans); }
  .control.planned { border-style:dashed; background:var(--card); }
  .control svg { width:13px; height:13px; flex:none; stroke:currentColor; }
  .legend { display:flex; flex-wrap:wrap; gap:16px; padding:10px 0 16px; border-top:1px solid var(--line); color:var(--muted); font:400 11px var(--mono); letter-spacing:.04em; }
  .legend i { display:inline-block; width:11px; height:11px; border-radius:2px; margin-right:6px; vertical-align:-1px; }
  /* Several routes: the most likely in full, the others lighter; tabs replace the fan on narrow screens. */
  .dim .tile { width:44px; height:44px; margin-bottom:6px; }
  .dim .tile svg { width:20px; height:20px; stroke:var(--muted); }
  .dim .label { font-weight:500; font-size:13px; color:var(--ink-2); }
  .edge.dim .rel { color:var(--muted); font-size:11px; }
  .edge .rel { white-space:normal; }
  .route { position:absolute; transform:translate(-50%,-100%); display:flex; gap:6px; align-items:center; white-space:nowrap;
           font:500 10px var(--mono); letter-spacing:.06em; text-transform:uppercase; }
  .route b, .tab b { display:inline-grid; place-items:center; width:18px; height:18px; border-radius:2px; font-weight:500;
                     background:var(--card); color:var(--ink-2); border:1px solid var(--line); }
  .route.top b, .tab[aria-selected="true"] b { background:var(--ink); color:#fff; border-color:var(--ink); }
  .lik.high { color:var(--red); } .lik.medium { color:var(--amber); } .lik.low { color:var(--green); }
  [hidden] { display:none !important; }
  .tabs { display:flex; flex-wrap:wrap; gap:8px; padding:12px 0 0; }
  .tab { display:flex; gap:6px; align-items:center; background:none; border:1px solid var(--line); border-radius:2px; padding:5px 8px;
         font:500 10px var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); cursor:pointer; }
  .tab[aria-selected="true"] { border-color:var(--ink); }
  .bar { height:8px; background:var(--line); position:relative; }
  .bar i { position:absolute; inset:0 auto 0 0; }

  main { max-width:96rem; } /* wide enough for the rail plus the three-lane fan */
  .panel h3 { margin:0 0 6px; font:500 10px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .panel .big { margin:0 0 6px; font-size:18px; font-weight:600; letter-spacing:-.02em; line-height:1.25; }
  .panel .big em { font-style:normal; color:var(--accent); }
  .panel .why { margin:0; font-size:12.5px; color:var(--ink-2); line-height:1.5; }
  .rc { display:grid; grid-template-columns:22px 1fr; gap:2px 8px; align-items:center; }
  .rc .n { grid-row:span 2; display:grid; place-items:center; width:20px; height:20px; border-radius:2px; border:1px solid var(--line); background:var(--card);
           font:500 11px var(--mono); color:var(--ink-2); }
  .rc.top .n { background:var(--ink); color:#fff; border-color:var(--ink); }
  .rc.total .n { background:var(--accent); color:#fff; border-color:var(--accent); }
  .rc .nm { font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rc .vv { display:flex; gap:8px; align-items:center; font:500 10px var(--mono); letter-spacing:.06em; text-transform:uppercase; }
  .rc .vv .bar { flex:1; height:6px; }
  .rc .vv .arrow { color:var(--muted); }
  .fixbox { background:var(--card); border-left:2px solid var(--accent); padding:8px 10px; font-size:12.5px; line-height:1.45; }
  .panel .legend { border-top:1px solid var(--line); padding:10px 0 0; gap:6px 16px; }
  /* Left rail: the score, routes, next fix and legend sit beside the diagram, read before it, and stay in view while scrolling. */
  .layout { display:grid; grid-template-columns:290px minmax(0,1fr); gap:32px; }
  .panel { display:grid; align-content:start; gap:18px; padding:16px 24px 16px 0; border-right:1px solid var(--line); position:sticky; top:0; align-self:start; }
  .routes { display:grid; gap:12px; }
  .panel .legend { flex-direction:column; }
  .rc.total { border-top:1px solid var(--line); padding-top:10px; }
  /* One route, or a narrow screen: no rail, the panel (or just the legend) goes above the diagram. */
  .layout.one { display:block; } .layout.one .panel { border:0; padding:12px 0 0; position:static; } .layout.one .panel .legend { flex-direction:row; border:0; }
  @media (max-width:64rem) { .layout { display:block; } .panel { border:0; border-bottom:1px solid var(--line); padding:16px 0; position:static; } .panel .legend { flex-direction:row; } .routes, .fixbox { max-width:36rem; } }
  .route.in { position:static; transform:none; justify-content:flex-end; margin-bottom:6px; }
  .control { white-space:nowrap; max-width:none; }
  .edge .rel, .route.in { background:var(--bg); }
  /* Zones behind the fan: who attacks, how, what we protect, what it costs us. */
  .zone { position:absolute; top:0; bottom:0; border-top:2px solid var(--zc); padding:10px 14px 0; }
  .zone + .zone { border-left:1px dashed var(--line); }
  .zone h4 { margin:0; font:500 10px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--zc); }
  .zone p { margin:3px 0 0; font-size:12px; line-height:1.4; color:var(--ink-2); max-width:34ch; }
  .fl { margin:6px auto 0; width:170px; text-align:left; border-left:2px dashed var(--red); padding:1px 0 1px 7px; font-size:12px; line-height:1.3; }
  .fl small { display:block; color:var(--red); font:500 9px var(--mono); letter-spacing:.08em; text-transform:uppercase; }
  .chip-s { display:inline-flex; gap:4px; align-items:center; text-align:left; font:500 11px var(--sans); color:var(--green); border:1px solid var(--green);
            background:var(--green-soft); border-radius:2px; padding:1px 5px; margin-bottom:4px; }
  .chip-s.planned { border-style:dashed; background:var(--card); }
  .chip-s svg { width:11px; height:11px; stroke:currentColor; }
  .hub .fl, .hub .fl-note { margin-left:calc(50% - 28px); width:160px; } .fl-note { display:block; margin-top:6px; padding:0; text-align:left; }
  .lane-hit { position:absolute; cursor:pointer; }
  .rc { cursor:pointer; padding:4px 6px; margin:0 -6px; border-radius:2px; } .rc.total { cursor:default; } .rc.sel { background:var(--accent-soft); }
  .layout:not(.one) .legend .z { display:none; } /* the zones already say who attacks and what we protect */
</style></head><body>

<script type="application/json" id="data">
{
  "id": "R-000",
  "title": "Attack path title",
  "scenario": "Risk source could <feared event> <asset> through <path>.",
  "inherent": { "score": "G4·V3", "level": "high" },
  "residual": { "score": "G4·V2", "level": "medium" },
  "source": { "icon": "attacker", "label": "Risk source", "type": "Risk source", "profile": "Who they are and what they want, in one plain line." },
  "asset":  { "icon": "payment",  "label": "Asset",       "type": "Business asset", "profile": "What it is worth to the business, in one plain line." },
  "gives": "business-app",
  "impact": { "icon": "alert",    "label": "Feared event", "type": "Impact · G4", "profile": "What it would cost us (G4), in one plain line.", "edge": { "label": "causes", "severity": "high" } },
  "routes": [
    {
      "name": "Most likely route",
      "needs": "outside",
      "likelihood": { "today": "V3", "after": "V1" },
      "steps": [
        { "icon": "mail", "label": "Lure", "type": "Lure" },
        { "icon": "user", "label": "Entry point", "type": "Identity",
          "findings": [ { "kind": "Weak spot", "title": "What makes it possible", "source": "Policy or audit" } ] }
      ],
      "edges": [
        { "label": "sends a lure", "severity": "high" },
        { "label": "takes over", "severity": "high", "control": { "name": "Control", "ref": "A.x.y", "status": "planned" } },
        { "label": "reaches", "severity": "high" }
      ]
    },
    {
      "name": "Second route",
      "needs": "outside",
      "likelihood": { "today": "V2", "after": "V2" },
      "steps": [ { "icon": "phone", "label": "Other way in", "type": "Lure" } ],
      "edges": [ { "label": "tries another way", "severity": "medium" }, { "label": "reaches", "severity": "medium" } ]
    }
  ],
  "nextFix": "The control that would lower the route that now sets the score."
}
</script>

<main>
<header><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p class="scenario" id="scenario"></p></header>
<section class="section"><h2 id="section">— Attack path</h2>
<div class="layout"><aside class="panel" id="score"></aside>
<div class="stage"><div class="tabs" id="tabs" role="tablist" hidden></div><div id="canvas"></div></div></div>
<template id="legend"><div class="legend">
  <span class="z"><i style="background:var(--ink)"></i>Who attacks</span>
  <span class="z"><i style="background:var(--accent)"></i>What we protect</span>
  <span><i style="border:1px dashed var(--red)"></i>Weak spot</span>
  <span><i style="background:var(--green-soft);border:1px solid var(--green)"></i>Protection in place</span>
  <span><i style="border:1px dashed var(--green)"></i>Protection planned</span>
</div></template>
</section>
</main>

<script>
const ICONS = {
  attacker: '<circle cx="12" cy="7" r="4"/><path d="M5.5 21a6.5 6.5 0 0 1 13 0"/><path d="M9 7h6"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  phone: '<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',
  key: '<circle cx="7.5" cy="15.5" r="4.5"/><path d="m11 12 9-9M16 7l3 3M14 9l2 2"/>',
  web: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  computer: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
  server: '<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/>',
  cloud: '<path d="M7 18a4.5 4.5 0 0 1-.6-9 6 6 0 0 1 11.6 1.5A3.75 3.75 0 0 1 17.5 18Z"/>',
  database: '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
  container: '<path d="M12 2 3 7v10l9 5 9-5V7Z"/><path d="m3 7 9 5 9-5M12 12v10"/>',
  vendor: '<path d="M3 21V9l6-4v4l6-4v4l6-4v16Z"/><path d="M7 17h2M11 17h2M15 17h2"/>',
  payment: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/>',
  lock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  bug: '<rect x="8" y="6" width="8" height="14" rx="4"/><path d="M12 6V3M4 13h4M16 13h4M5 7l3 2M19 7l-3 2M5 19l3-2M19 19l-3-2"/>',
  alert: '<path d="M12 3 2 21h20Z"/><path d="M12 10v5M12 18h.01"/>',
  shield: '<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6Z"/><path d="m9 12 2 2 4-4"/>'
};
const svgIcon = (n) => `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[n] || ICONS.alert}</svg>`;
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const d = JSON.parse(document.getElementById('data').textContent);
const $ = (id) => document.getElementById(id);
const lv = (v) => v ? v.level.charAt(0).toUpperCase() + v.level.slice(1) : '';
const vn = (s) => +((String(s || '').match(/\d/) || [0])[0]);
const LIK = { 1: ['Unlikely', 'low'], 2: ['Possible', 'medium'], 3: ['Likely', 'high'], 4: ['Near certain', 'high'] };
const word = (s) => (LIK[vn(s)] || ['', ''])[0];
const vf = (s) => vn(s) ? 'V' + Math.max(1, vn(s)) : '—';
const tone = (s) => (LIK[vn(s)] || ['', ''])[1];

// One shape for every case: a list of routes from the same source to the same asset and impact.
// The older one-path JSON (nodes, edges, findings) is drawn as is.
const legacy = !d.routes && d.nodes;
const routes = legacy ? [] : [...d.routes]
  .sort((a, b) => vn(b.likelihood?.today) - vn(a.likelihood?.today) || a.steps.length - b.steps.length).slice(0, 3);
// After fixes never drops below V1 (Unlikely); a missing value stays missing and shows as a dash.
routes.forEach((r) => { if (r.likelihood && /\d/.test(String(r.likelihood.after ?? '')) && !vn(r.likelihood.after)) r.likelihood.after = 'V1'; });
const many = routes.length > 1;
const flat = (r) => {
  const nodes = [{ ...d.source, role: 'source' }, ...r.steps, { ...d.asset, role: 'asset' }, { ...d.impact, role: 'impact' }];
  const findings = nodes.flatMap((nd, i) => (nd.findings || []).map((f) => ({ ...f, node: i })));
  return { nodes, edges: [...r.edges, d.impact.edge || {}], findings };
};

document.title = `${d.id} · ${d.title}`;
$("eyebrow").textContent = ['Risk', d.id, many ? 'Attack paths' : 'Attack path'].join(' · ');
$("title").innerHTML = esc(d.title) + (d.inherent ? `<span class="accent">${esc(lv(d.inherent))} today${d.residual ? `, ${esc(d.residual.level)} after fixes` : ''}.</span>` : '');
$("scenario").textContent = d.scenario || "";
if (many) $("section").textContent = `— Attack paths · ${routes.length} ways in, most likely first`;

const findingHtml = (f) => `<div class="finding" title="${esc(f.source)}"><small>${esc(f.kind)}</small><b>${esc(f.title)}</b></div>`;
const nodeHtml = (nd, fs, x, y, dim) => `<div class="node ${esc(nd.role || 'step')}${dim ? ' dim' : ''}" style="left:${x}px;top:${y}px">
  <div class="tile">${svgIcon(nd.icon)}${fs.length ? `<span class="badge">${fs.length}</span>` : ''}</div>
  <div class="label">${esc(nd.label)}</div><div class="type">${esc(nd.type)}</div>${fs.map(findingHtml).join('')}</div>`;
const chipHtml = (c) => c ? `<div class="control ${c.status === 'planned' ? 'planned' : ''}">${svgIcon('shield')}<span>${esc(c.name)} · ${esc(c.ref)}</span></div>` : '';
const startHtml = (x, y) => `<div class="start" title="Start" style="left:${x}px;top:${y}px"><svg viewBox="0 0 24 24"><path d="M9 7v10l8-5Z"/></svg></div>`;
const wiresSvg = (W, H, wires) => `<svg class="wires" width="${W}" height="${H}"><defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="var(--ink)"/></marker>
  <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#9AA0A6"/></marker>
  </defs>${wires}</svg>`;

// One path: one row when each step gets 190px or more; else a snake of up to 4 per row; one column on phones.
function drawPath(canvas, p) {
  const W = canvas.clientWidth, n = p.nodes.length;
  const oneRow = W / n >= 190;
  const gut = oneRow ? 70 : W > 1000 ? 190 : W > 700 ? 140 : 70, inner = W - 2 * gut;
  const perRow = oneRow ? n : Math.max(1, Math.min(n, Math.floor(inner / 240) || 1, 4));
  const colW = inner / perRow, rows = Math.ceil(n / perRow), single = perRow === 1;
  const findingsAt = (i) => p.findings.filter((f) => f.node === i);
  // Measure each node with its findings, so a tall stack never runs into the next row.
  canvas.innerHTML = p.nodes.map((nd, i) => nodeHtml(nd, findingsAt(i), -999, 0)).join('');
  const tall = [...canvas.querySelectorAll('.node')].map((el) => el.offsetHeight);
  const head = single ? 60 : 125; // room above the tiles for edge labels and control chips
  const rowH = [...Array(rows)].map((_, r) => head + Math.max(...tall.slice(r * perRow, r * perRow + perRow)) + 50 + (single ? 90 : 0));
  const lead = single ? 80 : 0;
  const top = rowH.map((_, r) => 20 + lead + rowH.slice(0, r).reduce((a, b) => a + b, 0));
  const pos = p.nodes.map((_, i) => {
    const r = Math.floor(i / perRow), c = i % perRow, col = r % 2 ? perRow - 1 - c : c;
    return { x: single ? 90 : gut + colW * col + colW / 2, y: top[r] + head + 29, r };
  });
  const H = top[rows - 1] + rowH[rows - 1];
  canvas.style.height = H + 'px';

  let html = '', wires = '';
  const s0 = pos[0], sx = single ? s0.x : Math.max(26, gut - 34), sy = single ? s0.y - 100 : s0.y;
  html += startHtml(sx, sy);
  wires += single ? `<path d="M${sx} ${sy + 22} L${s0.x} ${s0.y - 40}" stroke="var(--ink)" stroke-width="1.5" fill="none"/>`
                  : `<path d="M${sx + 22} ${sy} L${s0.x - 40} ${s0.y}" stroke="var(--ink)" stroke-width="1.5" fill="none"/>`;
  p.nodes.forEach((nd, i) => { html += nodeHtml(nd, findingsAt(i), pos[i].x, pos[i].y - 29); });
  p.edges.slice(0, n - 1).forEach((e, i) => {
    const a = pos[i], b = pos[i + 1];
    let path, mx, my, turn = 0, room;
    if (single) {
      path = `M${a.x} ${a.y + 40} L${b.x} ${b.y - 40}`; mx = a.x + 22; my = b.y - 100; turn = 2; room = W - mx - 16;
    } else if (a.r === b.r) {
      const dir = Math.sign(b.x - a.x);
      path = `M${a.x + dir * 40} ${a.y} L${b.x - dir * 40} ${b.y}`; mx = (a.x + b.x) / 2; my = a.y; room = colW - 90;
    } else {
      const side = a.x > W / 2 ? 1 : -1, ex = a.x + side * (colW / 2 + 10);
      path = `M${a.x + side * 40} ${a.y} C${ex} ${a.y} ${ex} ${a.y} ${ex} ${(a.y + b.y) / 2} S${ex} ${b.y} ${b.x + side * 40} ${b.y}`;
      mx = ex + side * 12; my = (a.y + b.y) / 2; turn = side; room = (side > 0 ? W - mx : mx) - 12;
    }
    const sev = e.severity || 'high';
    wires += `<path d="${path}" fill="none" stroke="var(--ink)" stroke-width="1.5" marker-end="url(#arrow)"/>`;
    const side = turn === 2 ? 'transform:none;text-align:left' : turn > 0 ? 'transform:translate(0,-50%);text-align:left'
               : turn < 0 ? 'transform:translate(-100%,-50%);text-align:right' : '';
    // Same-row edges stack chip, label and severity above the wire; turns put them beside the curve, chip last.
    const body = `<div class="rel">${esc(e.label)}</div><div class="sev ${esc(sev)}">${esc(sev)}</div>`;
    html += `<div class="edge${turn ? ' side' : ''}" style="left:${mx}px;top:${my - 6}px;max-width:${room}px;${side}">${turn ? body + chipHtml(e.control) : chipHtml(e.control) + body}</div>`;
  });
  canvas.innerHTML = wiresSvg(W, H, wires) + html;
}

// Several routes: they fan out from the source and join again where their steps become the same, else at the asset.
// Steps every route ends with are drawn once. Only the route in focus (pick) shows its weak spots and full protection names;
// the others show a count badge and the control's reference. Four zones say who attacks, how, what we protect, what it costs.
const same = (a, b) => !!a && !!b && a.label === b.label && (a.icon || '') === (b.icon || '');
const sharedCount = () => {
  const min = Math.min(...routes.map((r) => r.steps.length)), at = (r, i) => r.steps[r.steps.length - 1 - i];
  let n = 0;
  while (n < min - 1 && routes.every((r) => same(at(r, n), at(routes[0], n)))) n++; // every route keeps at least one step of its own
  return n;
};
const fanCols = () => { const n = sharedCount(); return 3 + n + Math.max(...routes.map((r) => r.steps.length - n)); };
function drawFan(canvas) {
  const n = sharedCount(), p = fanCols() - 3 - n, A = p + n + 1; // own-step columns 1..p, shared p+1..p+n, asset A, impact A+1
  const W = canvas.clientWidth, left = 120, colW = (W - left - 90) / (A + 1), X = (c) => left + c * colW;
  const dedupe = (fs) => [...new Map(fs.map((f) => [f.title, f])).values()];
  const shared = routes[0].steps.slice(routes[0].steps.length - n).map((st, j) =>
    ({ ...st, findings: dedupe(routes.flatMap((r) => r.steps[r.steps.length - n + j].findings || [])) }));
  const fl = (f) => `<div class="fl" title="${esc(f.source)}"><small>${esc(f.kind)}</small>${esc(f.title)}</div>`;
  const node = (nd, x, y, dim, open, extra = '') => `<div class="node ${esc(nd.role || 'step')}${dim ? ' dim' : ''}" style="left:${x}px;top:${y}px;width:180px">
    <div class="tile">${svgIcon(nd.icon)}${(nd.findings || []).length ? `<span class="badge">${nd.findings.length}</span>` : ''}</div>
    <div class="label">${esc(nd.label)}</div><div class="type">${esc(nd.type)}</div>${open ? (nd.findings || []).map(fl).join('') : ''}${extra}</div>`;
  const measure = (htmls) => { canvas.innerHTML = htmls.join(''); return [0, ...[...canvas.querySelectorAll('.node')].map((el) => el.offsetHeight)]; };
  const own = (r) => r.steps.slice(0, r.steps.length - n);
  const zoneH = 92, head = 80; // room for the zone headers; above each lane, for its tag, label and protection
  let y = zoneH;
  const ly = routes.map((r, i) => {
    const t = Math.max(...measure(own(r).map((st) => node(st, -999, 0, i !== pick, i === pick))));
    const v = y + head + 28; y += head + t + 16; return v;
  });
  const mid = (ly[0] + ly[ly.length - 1]) / 2;
  const hub = Math.max(...measure([...shared, d.source, d.asset, d.impact].map((st) => node(st, -999, 0, false, true, '<div class="type">x</div>'))));
  const H = Math.max(y, mid - 28 + hub + 30);
  canvas.style.height = H + 'px';

  const chip = (c, full) => c ? `<div class="chip-s${c.status === 'planned' ? ' planned' : ''}" title="${esc(c.name)} · ${esc(c.ref)}">${svgIcon('shield')}${full ? esc(c.name) + ' · ' : ''}${esc(c.ref)}</div>` : '';
  const lab = (e, x, yy, dim, al, full, tag = '') => `<div class="edge${dim ? ' dim' : ''}" style="left:${x}px;top:${yy - 6}px;transform:translate(${al === 'r' ? '-100%' : al === 'l' ? '0' : '-50%'},-100%);text-align:${al === 'r' ? 'right' : al === 'l' ? 'left' : 'center'}">${tag}${chip(e.control, full)}<div class="rel">${esc(e.label)}</div></div>`;
  const onHub = (e, x0, x1) => lab({ label: e.label }, (x0 + x1) / 2, mid, false, 'c', true)
    + (e.control ? `<div class="edge" style="left:${(x0 + x1) / 2}px;top:${mid + 12}px;transform:translate(-50%,0)">${chip(e.control, true)}</div>` : '');
  const wire = (path, dim) => `<path d="${path}" fill="none" stroke="${dim ? '#B4B9BF' : 'var(--ink)'}" stroke-width="${dim ? 1.2 : 1.6}" marker-end="url(#arrow${dim ? '-dim' : ''})"/>`;
  let html = startHtml(44, mid), wires = `<path d="M66 ${mid} L${X(0) - 40} ${mid}" stroke="var(--ink)" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>`;
  const join = X(p + 1) - 40; // where the lanes meet: the first shared step, else the asset
  routes.map((_, i) => i).sort((a, b) => (a === pick) - (b === pick)).forEach((i) => { // the route in focus is drawn last, on top
    const r = routes[i], u = r.steps.length - n, yy = ly[i], dim = i !== pick, g = dim ? 34 : 40, lik = r.likelihood?.today;
    const tag = `<div class="route in${i === 0 ? ' top' : ''}"><b>${i + 1}</b><span class="lik ${tone(lik)}">${esc(word(lik))}</span></div>`;
    wires += wire(`M${X(0) + 40} ${mid} C${X(0) + colW / 2} ${mid} ${X(1) - g - colW / 2} ${yy} ${X(1) - g} ${yy}`, dim);
    html += lab(r.edges[0] || {}, X(1) - g - 8, yy, dim, 'r', !dim, tag);
    for (let j = 1; j < u; j++) {
      wires += wire(`M${X(j) + g} ${yy} L${X(j + 1) - g} ${yy}`, dim);
      html += lab(r.edges[j] || {}, (X(j) + X(j + 1)) / 2, yy, dim, 'c', !dim);
    }
    const run = X(p) + g; // straight along the lane while it has no more steps, then a curve into the join
    wires += wire(`M${X(u) + g} ${yy} L${run} ${yy} C${run + colW / 2} ${yy} ${join - colW / 2} ${mid} ${join} ${mid}`, dim);
    html += lab(r.edges[u] || {}, X(u) + g + 8, yy, dim, 'l', !dim).replace('text-align:left', `text-align:left;max-width:${Math.max(120, join + 12 - (X(u) + g + 8) - 8)}px`);
    own(r).forEach((st, j) => { html += node(st, X(j + 1), yy - (dim ? 22 : 28), dim, !dim); });
    html += `<div class="lane-hit" data-i="${i}" title="Show route ${i + 1}" style="left:${X(1) - colW / 2}px;top:${yy - 60}px;width:${colW * p}px;height:${head + 40}px"></div>`;
  });
  const fr = routes[pick], fu = fr.steps.length - n;
  shared.forEach((st, j) => {
    html += node({ ...st, role: 'hub' }, X(p + 1 + j), mid - 28, false, true, j === 0 ? `<div class="type fl-note">shared by all ${routes.length} routes</div>` : '');
    wires += wire(`M${X(p + 1 + j) + 40} ${mid} L${X(p + 2 + j) - 40} ${mid}`, false);
    html += onHub(fr.edges[fu + 1 + j] || {}, X(p + 1 + j), X(p + 2 + j));
  });
  html += node({ ...d.source, role: 'source' }, X(0), mid - 28, false, true);
  html += node({ ...d.asset, role: 'asset' }, X(A), mid - 28, false, true);
  html += node({ ...d.impact, role: 'impact' }, X(A + 1), mid - 28, false, true);
  wires += wire(`M${X(A) + 40} ${mid} L${X(A + 1) - 40} ${mid}`, false);
  html += onHub(d.impact.edge || {}, X(A), X(A + 1));
  const b1 = X(0) + colW / 2, b2 = X(A) - colW / 2, b3 = X(A) + colW / 2;
  const zone = (x0, x1, c, h, txt) => `<div class="zone" style="left:${x0}px;width:${x1 - x0}px;--zc:${c}"><h4>${h}</h4>${txt ? `<p>${txt}</p>` : ''}</div>`;
  canvas.innerHTML = zone(0, b1, 'var(--ink)', 'Who attacks', esc(d.source.profile))
    + zone(b1, b2, 'var(--muted)', `How · ${routes.length} ways in`, `<b>Showing route ${pick + 1} of ${routes.length}</b>: ${esc(fr.name)}. Click a route to switch.`)
    + zone(b2, b3, 'var(--accent)', 'What we protect', esc(d.asset.profile))
    + zone(b3, W, 'var(--red)', 'What it costs us', esc(d.impact.profile))
    + wiresSvg(W, H, wires) + html;
  canvas.querySelectorAll('.lane-hit').forEach((el) => el.onclick = () => { pick = +el.dataset.i; draw(); });
}

// The left rail: the verdict, one bar per route (today faded, after fixes solid), the risk itself, the next best fix, the legend.
// The risk is as likely as its easiest route.
function drawScore() {
  const col = (s) => ({ high: 'var(--red)', medium: 'var(--amber)', low: 'var(--green)' })[tone(s)] || 'var(--muted)';
  const bar = (a, b, ca, cb) => `<div class="bar"><i style="width:${vn(a) * 25}%;background:${ca};opacity:.25"></i><i style="width:${Math.max(vn(b) ? 1 : 0, vn(b)) * 25}%;background:${cb}"></i></div>`;
  const worst = (k) => routes.reduce((w, r) => (vn(r.likelihood?.[k]) > vn(w.likelihood?.[k]) ? r : w), routes[0]);
  const t = worst('today'), a = worst('after'), T = t.likelihood?.today, A = a.likelihood?.after;
  const card = (n, name, x, y, cls, ca, cb) => `<div class="rc ${cls}"><span class="n">${n}</span><span class="nm" title="${esc(name)}">${esc(name)}</span>
    <span class="vv"><span class="lik ${tone(x)}">${esc(word(x))}</span>${bar(x, y, ca, cb)}<span>${vf(x)} <span class="arrow">→</span> ${vf(y)}</span></span></div>`;
  const rows = routes.map((r, i) => card(i + 1, r.name, r.likelihood?.today, r.likelihood?.after, i ? '' : 'top', col(r.likelihood?.today), col(r.likelihood?.after))).join('');
  const total = card('R', 'The risk = its easiest route', T, A, 'total', 'var(--ink)', 'var(--ink)');
  $("score").innerHTML = `<div><h3>Likelihood</h3><p class="big">${esc(word(T))} today,<br><em>${A ? esc(word(A).toLowerCase()) + ' after fixes' : 'no fix planned yet'}.</em></p>
    <p class="why">Easiest way in today: <b>${esc(t.name)}</b>. A risk is as likely as its easiest route.</p></div>
    <div class="routes">${rows}${total}</div>
    ${d.nextFix ? `<div><h3>Next best fix</h3><div class="fixbox">${esc(d.nextFix)}</div></div>` : ''}
    ${$("legend").innerHTML}`;
}

let pick = 0;
function draw() {
  const canvas = $("canvas"), W = canvas.clientWidth;
  if (legacy) return drawPath(canvas, { nodes: d.nodes, edges: d.edges || [], findings: d.findings || [] });
  // The fan needs 180px per column; below that, one route at a time behind tabs.
  const fan = many && (W - 210) / (fanCols() - 1) >= 180;
  $("tabs").hidden = !many || fan;
  if (many && !fan) {
    $("tabs").innerHTML = routes.map((r, i) => `<button class="tab" role="tab" aria-selected="${i === pick}" data-i="${i}"><b>${i + 1}</b>${esc(r.name)} · <span class="lik ${tone(r.likelihood?.today)}">${esc(word(r.likelihood?.today))}</span></button>`).join('');
    $("tabs").querySelectorAll('.tab').forEach((t) => t.onclick = () => { pick = +t.dataset.i; draw(); });
  }
  if (fan) drawFan(canvas); else drawPath(canvas, flat(routes[many ? pick : 0]));
  // The rail's route rows switch the route in focus too.
  document.querySelectorAll('.routes .rc:not(.total)').forEach((el, i) => { el.classList.toggle('sel', i === pick); el.onclick = () => { pick = i; draw(); }; });
}
if (many) drawScore(); else { $("score").innerHTML = $("legend").innerHTML; document.querySelector('.layout').classList.add('one'); }
draw(); addEventListener('resize', draw);
</script>
</body></html>
