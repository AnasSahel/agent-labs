<!doctype html>
<!-- Risk chain template. Copy, then fill one .box per step and one .control under the box it blocks. -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>R-000 · Risk path</title>
<style>
  :root { --bg:#faf9f6; --cause-bg:#f1efe9; --cause-line:#8a877f; --cause-ink:#3d3b36;
          --fx-bg:#fbebe7; --fx-line:#c0563f; --fx-ink:#8a2a12; --ok-bg:#e8f5e9; --ok-line:#2e7d32; --ok-ink:#1b5e20; --arrow:#8a877f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1b19; --cause-bg:#2b2a27; --cause-ink:#e6e3dc;
          --fx-bg:#3a201a; --fx-ink:#f4b4a3; --ok-bg:#1d3320; --ok-ink:#a5d6a7; } }
  body { margin:0; padding:24px 16px; background:var(--bg); font:16px/1.3 system-ui, sans-serif; }
  .chain { display:flex; flex-wrap:wrap; align-items:flex-start; gap:8px; }
  .step { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .box, .control { border:1px solid; border-radius:12px; padding:14px 22px; text-align:center; min-width:170px; }
  .box b { display:block; font-size:20px; margin-bottom:6px; }
  .cause { background:var(--cause-bg); border-color:var(--cause-line); color:var(--cause-ink); }
  .effect { background:var(--fx-bg); border-color:var(--fx-line); color:var(--fx-ink); }
  .control { background:var(--ok-bg); border-color:var(--ok-line); color:var(--ok-ink); border-style:dashed; font-size:14px; padding:8px 14px; min-width:0; }
  .arrow { color:var(--arrow); font-size:22px; align-self:center; margin-top:-4px; }
  @media (max-width:640px) { .chain { flex-direction:column; align-items:stretch; } .arrow { transform:rotate(90deg); } }
</style></head><body>
<div class="chain">
  <div class="step"><div class="box cause"><b>Cause</b>What happens</div></div>
  <span class="arrow">→</span>
  <div class="step"><div class="box effect"><b>Step ↑</b>Why</div><div class="control">🛡 Control · A.x.y</div></div>
  <span class="arrow">→</span>
  <div class="step"><div class="box effect"><b>Feared event ↓</b>Impact · G4</div></div>
</div>
</body></html>
